# CI Coach en Muscu (CM-56).
#
# - `checks` : typecheck, lint, tests unitaires, build. Aucun secret : le build
#   tourne avec des variables Supabase factices (aucun appel réseau au build).
# - `e2e` (CM-98) : parcours réels qui ÉCRIVENT en base, contre une stack
#   Supabase LOCALE (Docker) recréée à chaque run : migrations de
#   supabase/migrations/ + supabase/seed.sql. Aucun secret, aucune URL de prod.
#   Voir tests/e2e/README.md. CM-89 (PR 3) : puis smoke de l'export natif
#   (`npm run build:native`, projet Playwright `native`, voir NATIVE.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, lint, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test:unit

      # CM-89 (PR 3) : règles de la cible native (routeur iOS, placeholder,
      # contrôle de l'export), lanceur intégré de Node.
      - name: Tests des scripts natifs
        run: npm run test:scripts

      - name: Build (env factices)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://x.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: x

  e2e:
    name: Tests e2e (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_ALLOW_WRITES: "1"
      # Données de supabase/seed.sql (fictives). Les parcours se connectent
      # avec le compte « Toi » du seed (tests/e2e/helpers.ts, CM-59 B).
      E2E_SEANCE_NAME: Haut du corps
      # CM-86 : inscription ouverte pour le parcours d'onboarding. CM-88
      # (PR 7) : variable PUBLIQUE, gravée au BUILD (`npm run build` de ce
      # job la lit) ; en prod elle reste absente (fermée).
      NEXT_PUBLIC_SIGNUP_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # Services inutiles à l'app exclus (elle ne parle qu'à PostgREST via
      # Kong). `gotrue` reste démarré : sans lui, `supabase status` ne donne
      # pas la clé anon.
      - name: Démarrer Supabase local
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Recréer la base (migrations + seed)
        run: supabase db reset

      # CM-59 : policies RLS par duo et droits anon / authenticated
      # (supabase/tests/*.sql, pgTAP). Transaction annulée : la base seedée
      # reste intacte pour la suite.
      - name: Tests RLS (pgTAP)
        run: supabase test db

      # CM-85 : contraintes du modèle duo (2 membres max, un seul duo par
      # membre, FK profils / comptes, rien pour anon).
      # Transaction annulée : la base seedée reste intacte pour les e2e.
      - name: Vérifications SQL (CM-85)
        run: docker exec -i supabase_db_coach-en-muscu psql -U postgres -v ON_ERROR_STOP=1 < supabase/checks/cm85_duos.sql

      - name: Variables Supabase locales
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY)=' \
            | tr -d '"' > supabase.env
          if [ "$(wc -l < supabase.env)" -ne 2 ]; then
            echo "::error::supabase status n'a pas fourni URL + clés" && exit 1
          fi
          # Garde-fou : uniquement une base locale.
          grep -qE '^NEXT_PUBLIC_SUPABASE_URL=http://127\.0\.0\.1:' supabase.env \
            || { echo "::error::URL Supabase non locale, refus" && exit 1; }
          cat supabase.env >> "$GITHUB_ENV"
          grep '^NEXT_PUBLIC_SUPABASE_URL=' supabase.env | sed 's/^NEXT_PUBLIC_SUPABASE_URL=/E2E_SUPABASE_URL=/' >> "$GITHUB_ENV"
          rm supabase.env

      - name: Cache navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Build (Supabase local)
        run: npm run build

      - name: Démarrer l'app
        run: |
          npm run start -- -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "L'app n'a pas répondu en 60 s" && cat next.log && exit 1

      - name: Tests e2e
        run: npm run test:e2e

      # CM-89 (PR 3) : cible native. Export statique (mêmes variables
      # Supabase locales, gravées au build) servi par scripts/serve-native.mjs,
      # qui imite le routeur iOS de la PR 4. Le serveur Next est arrêté
      # d'abord : `next build` réécrit `.next`.
      - name: Build natif (export statique)
        run: |
          pkill -f "next start" || true
          npm run build:native

      - name: Servir le bundle natif
        run: |
          npm run serve:native -- --port 4300 > serve-native.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4300/login && exit 0
            sleep 1
          done
          echo "Le serveur statique n'a pas répondu en 30 s" && cat serve-native.log && exit 1

      - name: Tests e2e natifs
        run: npm run test:native
        env:
          E2E_NATIVE_BASE_URL: http://localhost:4300

      # CM-88 (PR 6) : plus de second passage avec DATA_CLIENT=service. Plus
      # aucun écran ne lit ni n'écrit de données côté serveur : le filet
      # service-role n'est plus jamais utilisé (son code part en PR 8).

      - name: Logs Supabase
        if: failure()
        run: docker logs supabase_rest_coach-en-muscu > supabase-rest.log 2>&1 || true

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            next.log
            serve-native.log
            supabase-rest.log
          retention-days: 7
