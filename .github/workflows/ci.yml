# CI Coach en Muscu (CM-56).
#
# - `checks` : typecheck, lint, tests unitaires, build. Aucun secret : le build
#   tourne avec des variables Supabase factices (aucun appel réseau au build).
# - `e2e` (CM-98) : parcours réels qui ÉCRIVENT en base, contre une stack
#   Supabase LOCALE (Docker) recréée à chaque run : migrations de
#   supabase/migrations/ + supabase/seed.sql. Aucun secret, aucune URL de prod.
#   Voir tests/e2e/README.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, lint, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test:unit

      - name: Build (env factices)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://x.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: x
          SUPABASE_SERVICE_ROLE_KEY: x

  e2e:
    name: Tests e2e (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_ALLOW_WRITES: "1"
      # Données de supabase/seed.sql (fictives).
      E2E_PROFILE_NAME: Toi
      E2E_SEANCE_NAME: Haut du corps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # Services inutiles à l'app exclus (elle ne parle qu'à PostgREST via
      # Kong). `gotrue` reste démarré : sans lui, `supabase status` ne donne
      # pas les clés anon / service_role.
      - name: Démarrer Supabase local
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Recréer la base (migrations + seed)
        run: supabase db reset

      - name: Variables Supabase locales
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | tr -d '"' > supabase.env
          if [ "$(wc -l < supabase.env)" -ne 3 ]; then
            echo "::error::supabase status n'a pas fourni URL + clés" && exit 1
          fi
          # Garde-fou : uniquement une base locale.
          grep -qE '^NEXT_PUBLIC_SUPABASE_URL=http://127\.0\.0\.1:' supabase.env \
            || { echo "::error::URL Supabase non locale, refus" && exit 1; }
          cat supabase.env >> "$GITHUB_ENV"
          grep '^NEXT_PUBLIC_SUPABASE_URL=' supabase.env | sed 's/^NEXT_PUBLIC_SUPABASE_URL=/E2E_SUPABASE_URL=/' >> "$GITHUB_ENV"
          rm supabase.env

      - name: Cache navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Build (Supabase local)
        run: npm run build

      - name: Démarrer l'app
        run: |
          npm run start -- -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "L'app n'a pas répondu en 60 s" && cat next.log && exit 1

      - name: Tests e2e
        run: npm run test:e2e

      - name: Logs Supabase
        if: failure()
        run: docker logs supabase_rest_coach-en-muscu > supabase-rest.log 2>&1 || true

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            next.log
            supabase-rest.log
          retention-days: 7
